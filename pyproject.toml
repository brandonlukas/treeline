[project]
name = "treeline"
version = "0.1.0"
description = "Multi-level cell type annotation: descends the Cell Ontology only as far as the evidence supports"
requires-python = ">=3.11"
dependencies = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "leidenalg",
    "igraph",
    "pandas",
    "numpy",
    "pyarrow",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treeline"]

[tool.ruff]
line-length = 100
